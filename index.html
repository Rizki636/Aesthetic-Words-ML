<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Aesthetic Copy</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
}

h2 {
  text-align: center;
}

.item {
  background: #1e293b;
  margin-bottom: 12px;
  padding: 12px;
  border-radius: 12px;
}

.preview {
  font-size: 16px;
  margin-bottom: 6px;
}

.raw {
  font-size: 12px;
  opacity: 0.6;
  margin-bottom: 8px;
  word-break: break-all;
}

button {
  background: #38bdf8;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: black;
  font-weight: bold;
}

button:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<h2>✨ Aesthetic Words ML ✨</h2>
<div id="list"></div>

<script>
const data = [
"[FFC0CB][i]Soft[/i] [87CEFA]Dream",
"[E6E6FA][i]Lavender[/i] [FFDAB9]Glow",
"[FFFACD][i]Golden[/i] [AFEEEE]Light",
"[FFD1DC][i]Blush[/i] [B0E0E6]Sky",
"[FFE4E1][i]Gentle[/i] [87CEEB]Wave",
"[D8BFD8][i]Silent[/i] [FFD700]Shine",
"[FFF0F5][i]Light[/i] [00BFFF]Breeze",
"[F0E68C][i]Warm[/i] [FFB6C1]Sunset",
"[AFEEEE][i]Cool[/i] [FFDAB9]Horizon",
"[FFEFD5][i]Peach[/i] [00FA9A]Bloom",
"[E0FFFF][i]Calm[/i] [FFB6C1]Soul",
"[FFDAB9][i]Peach[/i] [E6E6FA]Mist",
"[FFB6C1][i]Pink[/i] [AFEEEE]Cloud",
"[B0E0E6][i]Blue[/i] [FFFACD]Glow",
"[FFF5EE][i]Pure[/i] [87CEFA]Sky",
"[FFD1DC][i]Sweet[/i] [00FFFF]Aura",
"[E6E6FA][i]Dreamy[/i] [FFD700]Light",
"[FFE4E1][i]Soft[/i] [B0C4DE]Haze",
"[AFEEEE][i]Aqua[/i] [FFB6C1]Glow",
"[FFFACD][i]Sunny[/i] [87CEEB]Day",
"[FFE4E1][i]Cozy[/i] [AFEEEE]Vibe",
"[FFD1DC][i]Lovely[/i] [87CEFA]Sky",
"[E0FFFF][i]Fresh[/i] [FFDAB9]Breeze",
"[FFF0F5][i]Calm[/i] [B0E0E6]Dream",
"[FFEFD5][i]Warm[/i] [87CEEB]Light",
"[AFEEEE][i]Chill[/i] [FFD1DC]Mood",
"[FFDAB9][i]Soft[/i] [E0FFFF]Glow",
"[E6E6FA][i]Quiet[/i] [FFB6C1]Soul",
"[FFFACD][i]Bright[/i] [AFEEEE]Sky",
"[FFD1DC][i]Sweet[/i] [B0C4DE]Haze"
];

function parseML(text) {
  let color = "#ffffff";
  return text
    .replace(/\[([A-F0-9]{6})\]/g, (_, c) => {
      color = "#" + c;
      return `<span style="color:${color}">`;
    })
    .replace(/\[i\]/g, "<i>")
    .replace(/\[\/i\]/g, "</i>")
    .replace(/\[b\]/g, "<b>")
    .replace(/\[\/b\]/g, "</b>")
    + "</span>";
}

function copyText(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  document.body.removeChild(textarea);
}

const container = document.getElementById("list");

data.forEach((text, index) => {
  const div = document.createElement("div");
  div.className = "item";

  const preview = document.createElement("div");
  preview.className = "preview";
  preview.innerHTML = (index + 1) + ". " + parseML(text);

  const raw = document.createElement("div");
  raw.className = "raw";
  raw.textContent = text;

  const btn = document.createElement("button");
  btn.textContent = "Copy";
  btn.onclick = () => {
    copyText(text);
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy", 1000);
  };

  div.appendChild(preview);
  div.appendChild(raw);
  div.appendChild(btn);

  container.appendChild(div);
});
</script>

</body>
</html>
